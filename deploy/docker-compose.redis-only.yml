# Redis-only compose file for the "app runs locally, Redis runs on the
# droplet" setup. Postgres and everything else stay on your local machine
# for now — this is NOT the full production compose (see docker-compose.prod.yml
# for that, once you deploy the whole app to the droplet).
#
# Usage on the droplet: `docker compose --env-file .env -f docker-compose.redis-only.yml up -d`
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      # Bound to the droplet's own localhost only — reached from your local
      # machine via an SSH tunnel (deploy/DEPLOYMENT.md), never exposed
      # directly to the public internet.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data

volumes:
  redis-data:
