# Self-hosted Postgres + Redis for the droplet. The Node app (API, workers)
# runs directly on the host via PM2, NOT in this compose file — the
# code-execution worker talks to the host's own Docker daemon (/var/run/docker.sock)
# to launch candidate-code sandbox containers, which is simplest when the
# worker itself isn't also inside a container.
#
# Usage: from this directory, `docker compose --env-file .env -f docker-compose.prod.yml up -d`
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"   # bound to localhost only — never expose Postgres publicly
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:6379:6379"  # bound to localhost only — never expose Redis publicly
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
