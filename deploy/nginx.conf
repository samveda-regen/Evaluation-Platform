# Reverse proxy for the droplet. Copy to /etc/nginx/sites-available/talentq,
# symlink into sites-enabled, replace yourdomain.com, then run:
#   sudo certbot --nginx -d yourdomain.com
# which will auto-add the HTTPS server block and redirect for you — no need
# to hand-write the TLS section.

server {
    listen 80;
    server_name yourdomain.com;

    client_max_body_size 50m;  # matches express.json({limit:'50mb'}) in backend/src/index.ts

    # Frontend static build (run `npm run build` in frontend/, output goes to frontend/dist)
    root /var/www/talentq/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
